<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
  <h2 class="mb-4">ยืนยันการสั่งซื้อ</h2>

  <h5>เลือกไซส์เสื้อ</h5>
  <select class="form-select mb-3" id="size">
    <option value="">-- กรุณาเลือกไซส์ --</option>
    <option value="S">ไซส์ S</option>
    <option value="M">ไซส์ M</option>
    <option value="L">ไซส์ L</option>
    <option value="XL">ไซส์ XL</option>
    <option value="XL">ไซส์ XXL</option>
  </select>

  <h5>จำนวน</h5>
  <input type="number" class="form-control mb-3" id="quantity" min="1" value="1">

  <h5>ชื่อ-สกุล</h5>
  <input class="form-control mb-3" id="fullname" placeholder="ชื่อ-สกุล">

  <h5>ที่อยู่จัดส่ง</h5>
  <input class="form-control mb-3" id="address" placeholder="ที่อยู่">

  <h5>วิธีจัดส่ง</h5>
  <select class="form-select mb-3" id="shipping">
    <option value="ไปรษณีย์ไทย">ไปรษณีย์ไทย</option>
    <option value="Kerry">Kerry</option>
  </select>

  <h5>วิธีชำระเงิน</h5>
  <select class="form-select mb-3" id="payment">
    <option value="">-- กรุณาเลือก --</option>
    <option value="transfer">โอนเงิน</option>
    <option value="cod">เก็บเงินปลายทาง</option>
  </select>

  <button class="btn btn-success btn-lg mt-3" onclick="submitOrder()">
    ยืนยันการสั่งซื้อ
  </button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  runTransaction,
  serverTimestamp,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "ของคุณ",
  authDomain: "ของคุณ",
  projectId: "father-3e37c",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== สั่งซื้อ ===== */
window.submitOrder = async () => {
  const productId = "shop_industry";

  const sizeValue = document.getElementById("size").value;
  const qty = Number(document.getElementById("quantity").value);
  const fullnameValue = document.getElementById("fullname").value.trim();
  const addressValue = document.getElementById("address").value.trim();
  const shippingValue = document.getElementById("shipping").value;
  const paymentValue = document.getElementById("payment").value;

  if (!sizeValue || !fullnameValue || !addressValue || !paymentValue || qty <= 0) {
    alert("กรุณากรอกข้อมูลให้ครบ");
    return;
  }

  const productRef = doc(db, "products", productId);

  try {
    await runTransaction(db, async (transaction) => {
      const snap = await transaction.get(productRef);
      if (!snap.exists()) throw "ไม่พบสินค้า";

      const stock = snap.data().stock?.[sizeValue] ?? 0;
      if (stock < qty) throw `สต็อกไม่พอ (เหลือ ${stock})`;

      // ตัดสต็อก
      transaction.update(productRef, {
        [`stock.${sizeValue}`]: stock - qty
      });

      // บันทึกออเดอร์
      await addDoc(collection(db, "orders"), {
        productId,
        size: sizeValue,
        qty,
        fullname: fullnameValue,
        address: addressValue,
        shipping: shippingValue,
        payment: paymentValue,
        status: paymentValue === "transfer"
          ? "รอชำระเงิน"
          : "รอดำเนินการ",
        createdAt: serverTimestamp()
      });
    });

    /* ✅ redirect แน่นอน */
    if (paymentValue === "transfer") {
      window.location.href = "pay_transfer.html";
      return;
    }

    if (paymentValue === "cod") {
      window.location.href = "review.html";
      return;
    }

  } catch (err) {
    alert("❌ " + err);
  }
};
</script>

</body>
</html>
